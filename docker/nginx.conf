server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Unauthenticated, for the container healthcheck and Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/basic-auth.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes all fall back to the SPA shell, which is never cached
    # so a new deploy shows up on the next load.
    location / {
        include /etc/nginx/basic-auth.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
